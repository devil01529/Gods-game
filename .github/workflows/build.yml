name: Test and build Worldkeeper
on:
  push:
    branches: [main, codex/worldkeeper-android]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.3
          use-dotnet: false
          include-templates: true
      - name: Import project
        run: godot --headless --editor --import --quit
      - name: Deterministic simulation regression suite
        run: godot --headless --script tests/run_tests.gd
      - name: Play through civilization progression
        run: |
          timeout 300 godot --headless --script tests/progression.gd | tee progression.log
          grep -F 'PROGRESSION_PASS' progression.log
      - name: Verify radial physics and spherical collisions
        run: |
          timeout 90 godot --headless --script tests/physics_integration.gd | tee physics.log
          grep -F 'PHYSICS_PASS' physics.log
      - name: Test real pointer and keyboard paths
        run: |
          timeout 90 godot --headless --quit-after 600 -- --input-smoke | tee input.log
          grep -F 'INPUT_SMOKE_PASS' input.log
      - name: Test mobile command sheet and touch gestures
        run: |
          timeout 90 godot --headless --quit-after 600 -- --input-smoke --mobile-ui | tee mobile.log
          grep -F 'INPUT_SMOKE_PASS' mobile.log
      - name: Test scene integration
        run: |
          timeout 90 godot --headless -- --smoke | tee smoke.log
          grep -F 'UI_SMOKE_PASS' smoke.log
      - name: Configure Android export
        run: |
          sdkmanager 'platform-tools' 'build-tools;36.0.0' 'platforms;android-36'
          python3 tools/configure_android.py
          mkdir -p "$HOME/.local/share/godot/keystores"
          if [ ! -f "$HOME/.local/share/godot/keystores/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.local/share/godot/keystores/debug.keystore" -alias androiddebugkey -storepass android -keypass android -dname 'CN=Worldkeeper Debug,O=Worldkeeper,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Export Android, Linux and Windows
        run: |
          mkdir -p builds
          godot --headless --export-debug Android builds/Worldkeeper-planet.apk
          godot --headless --export-release Linux builds/Worldkeeper-linux.x86_64
          godot --headless --export-release Windows builds/Worldkeeper-windows.exe
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose builds/Worldkeeper-planet.apk
          sha256sum builds/Worldkeeper-planet.apk > builds/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Worldkeeper-Living-Planet-Android
          path: |
            builds/Worldkeeper-planet.apk
            builds/SHA256SUMS.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Worldkeeper-Desktop
          path: |
            builds/Worldkeeper-linux.x86_64
            builds/Worldkeeper-windows.exe
          retention-days: 30
  publish-living-planet:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/worldkeeper-android'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: devil01529/Gods-game
    steps:
      - name: Check out the locally verified signed APK
        uses: actions/checkout@v4
        with:
          ref: codex/living-planet-apk
      - name: Verify distribution checksum
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish the direct APK download
        run: |
          cat > NOTES.md <<'NOTES'
          Worldkeeper Living Planet 0.2 — Android APK

          Download Worldkeeper-planet.apk below and open it on your phone. No ZIP extraction is needed. This installs as Worldkeeper Planet alongside the base APK.

          Includes a continuous spherical world, 21 original 3D models, persistent NPC commands, revised menus, lethal calamities, interacting water/fire/lightning, radial debris physics, pets and wildlife, and reproduction with divine intervention.

          Requires ARM64 Android 7.0+ and OpenGL ES 3.0. This is a debug-signed development preview. Local verification: 75 simulation checks, physics integration, progression fixture and mobile input tests. Physical Android performance still requires device testing.
          NOTES
          if gh release view v0.2.0-preview > /dev/null 2>&1; then
            gh release upload v0.2.0-preview Worldkeeper-planet.apk SHA256SUMS.txt --clobber
          else
            source_commit=$(cat SOURCE_COMMIT)
            gh release create v0.2.0-preview Worldkeeper-planet.apk SHA256SUMS.txt --target "$source_commit" --title 'Worldkeeper Living Planet 0.2 — Android APK' --notes-file NOTES.md --prerelease
          fi
          gh release view v0.2.0-preview --json url,assets
